properties:
  configuration:
    ingress:
      external: true
      targetPort: 8080
      transport: auto
      allowInsecure: false
      exposedPort: 443
    activeRevisionsMode: single
  template:
    revisionSuffix: v1
    containers:
    - name: infratrack-app
      image: infratrackacr.azurecr.io/infratrack-platform:latest
      resources:
        cpu: 0.5
        memory: 1.0Gi
      env:
      - name: PORT
        value: "8080"
      - name: NODE_ENV
        value: production
      probes:
      - type: startup
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 3
        timeoutSeconds: 10
        failureThreshold: 10
      - type: liveness
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      - type: readiness
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
