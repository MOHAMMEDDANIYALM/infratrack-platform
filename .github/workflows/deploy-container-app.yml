name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  REGISTRY: infratrackacr.azurecr.io
  IMAGE_NAME: infratrack-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR password
        id: acr_password
        run: |
          PASSWORD=$(az acr credential show --name infratrackacr --query "passwords[0].value" --output tsv)
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: infratrackacr
          password: ${{ steps.acr_password.outputs.password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: infratrackacr
          registryPassword: ${{ steps.acr_password.outputs.password }}
          containerAppName: infratrack-app
          resourceGroup: infratrack-rg
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          location: centralindia
          containerAppEnvironment: infratrack-env
      
      - name: Configure Container App Port and Environment
        run: |
          echo "Configuring port to 8080..."
          az containerapp ingress set \
            --name infratrack-app \
            --resource-group infratrack-rg \
            --type external \
            --target-port 8080 || true
          
          echo "Setting environment variables..."
          az containerapp update \
            --name infratrack-app \
            --resource-group infratrack-rg \
            --set-env-vars \
              PORT=8080 \
              NODE_ENV=production \
              FRONTEND_URL=https://infratrack-app.graycoast-34d22b0c.centralindia.azurecontainerapps.io || true
          
          echo "Configuration complete"
