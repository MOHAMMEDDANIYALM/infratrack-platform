name: Trigger auto deployment for infratrack-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/infratrack-app-AutoDeployTrigger-d005d87f-54a0-4e0a-99bb-57d1f8386c3a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.INFRATRACKAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.INFRATRACKAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.INFRATRACKAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: infratrackacr.azurecr.io
          registryUsername: ${{ secrets.INFRATRACKAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.INFRATRACKAPP_REGISTRY_PASSWORD }}
          containerAppName: infratrack-app
          resourceGroup: infratrack-rg
          imageToBuild: infratrackacr.azurecr.io/infratrack-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


