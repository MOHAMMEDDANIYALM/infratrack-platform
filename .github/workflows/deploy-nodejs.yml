name: Deploy Full Stack to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Frontend .env
        working-directory: frontend
        run: |
          cat > .env << EOF
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_MICROSOFT_CLIENT_ID=${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID=${{ secrets.VITE_MICROSOFT_TENANT_ID }}
          VITE_REDIRECT_URI=${{ secrets.VITE_REDIRECT_URI }}
          EOF

      - name: Create Backend .env
        working-directory: backend
        run: |
          cat > .env << EOF
          PORT=5000
          NODE_ENV=production
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_TENANT_ID=${{ secrets.MICROSOFT_TENANT_ID }}
          ALLOWED_LOGIN_DOMAINS=${{ secrets.ALLOWED_LOGIN_DOMAINS }}
          EOF

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          
      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          npm ci --only=production
          
      - name: Create Deployment Package
        run: |
          # Create deployment directory
          mkdir -p deploy-package
          
          # Copy backend files
          cp -r backend/src deploy-package/
          cp backend/server.js deploy-package/
          cp backend/package.json deploy-package/
          cp backend/package-lock.json deploy-package/
          cp -r backend/node_modules deploy-package/
          
          # Copy frontend build to public folder
          mkdir -p deploy-package/public
          cp -r frontend/dist/* deploy-package/public/
          
      - name: Create web.config for Azure
        run: |
          cat > deploy-package/web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
              </handlers>
              <rewrite>
                <rules>
                  <rule name="NodeInspector" patternSyntax="ECMAScript" stopProcessing="true">
                    <match url="^server.js\/debug[\/]?" />
                  </rule>
                  <rule name="DynamicContent">
                    <conditions>
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="True"/>
                    </conditions>
                    <action type="Rewrite" url="server.js"/>
                  </rule>
                </rules>
              </rewrite>
              <httpErrors existingResponse="PassThrough" />
              <iisnode node_env="production" loggingEnabled="true" />
            </system.webServer>
          </configuration>
          EOF

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: infratrack-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package
